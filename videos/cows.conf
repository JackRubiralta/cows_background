# cows & cows & cows - cyriak, 2010 (the official upload on cyriak's channel)
TITLE="cows & cows & cows (cyriak, 2010)"
URL="https://www.youtube.com/watch?v=FavUpD_IjVY"
# 248-sr is YouTube's 1080p upscale of the 480p original; any 25 fps stream
# has the same frame numbering, so the fallback works with the ranges below.
FORMAT="248-sr/bestvideo[height<=1080][fps<=30]"
FPS=25
DEFAULT_MODE=pingpong

# Frame ranges are half-open [first, end) at FPS.
#
# The "COWS & COWS & COWS" title is visible until frame 163 and the fade to
# black (followed by the "CYRIAK 2010" credit) starts at frame 3176, so the
# ping-pong covers everything in between: forward, then backward, forever.
PINGPONG=166:3173

# Frame 2250 is near-identical to frame 1762 (the jump is smaller than a
# normal frame-to-frame step there), so playing 1762..2249 and jumping back
# is invisible. Found by comparing every pair of frames in the video.
PERFECT=1762:2250
